- date: Sep 11 2026
  time: 12:00PM – 1:00PM
  note: Networks Seminar
  speaker: Erez Aghion
  affiliation: Department of Physics, University of Louisiana at Lafayette
  title: 'How Fishing improves the design of Nanomachines'
  abstract: |-
    Harvesting is the selective removal of individuals from a heterogeneous population, which reshapes trait distributions and can alter the system's evolution. Remarkably, even though trait selection and removal of individuals from dynamical ensembles occurs in natural evolution, and is continuously practiced in agriculture and animal breeding -- very little mathematical investigation has been conducted to quantify the effects of repeatedly culling the population and allowing it to re-evolve from effectively new initial conditions. We derive exact mathematical and physical results showing how harvesting can accelerate or halt complex dynamics without altering the microscopic equations of motion. With that... can fishermen tell us how to optimize the thermal efficiency of Nanomachines?
